sem-permissao: "&cVocê não possui permissão para utilizar este chat."

chat-global-desativado: "&cO chat global está desativado."
chat-local-desativado: "&cO chat local está desativado."
chat-staff-desativado: "&cO chat da staff está desativado."

uso-global: "&cUso correto: /g <mensagem>"
uso-local: "&cUso correto: /l <mensagem>"
uso-staff: "&cUso correto: /s <mensagem>"
uso-chat-reload: "&cUso correto: /chat reload"

mensagem-vazia: "&cVocê precisa informar uma mensagem."

# Exibida a quem tentar usar /l pelo console: o chat local
# depende de uma localização no mundo, que o console não tem.
