# ============================================================
# ChatPlus - Configuração principal
# ============================================================
# Placeholders disponíveis:
# {prefix}  -> cargo/prefixo fornecido pelo CargoPlus
# {tag}     -> reservado para compatibilidade; renderizado pelo ChatService
# {player}  -> nome do remetente
# {message} -> mensagem enviada
# {habilidade_tag} -> tag dinâmica do Top 1 da habilidade
# {world}   -> mundo do remetente no chat local
#
# A tag do clan é renderizada uma única vez pelo ChatService,
# logo depois do cargo, preservando letras e cores do ClanPlus.
#
# As mensagens de entrada e saída são gerenciadas pelo UtilidadesPlus.
# As chaves técnicas existentes são preservadas para compatibilidade.
# ============================================================

chat:
  # 0 desativa o intervalo entre mensagens.
  delay-segundos: 0
  # Quantidade máxima de caracteres por mensagem.
  limite-mensagem: 256

  # ----------------------------------------------------------
  # HOVER DO NICKNAME
  # ----------------------------------------------------------
  # Placeholders:
  # {player}  -> nickname do jogador
  # {cargo}   -> cargo/grupo do jogador
  # {coins}   -> saldo de Coins
  # {moedas}  -> saldo de Moedas
  # {poder}   -> poder total do HabilidadesPlus
  # {clan}    -> clã do jogador
  # {kdr}     -> K/D ratio
  # {tempo}   -> tempo total online
  hover:
    jogador:
      titulo: "&7Informações de {player}"
      coins: "&a$ &7ᴄᴏɪɴs &8• &a{coins}"
      moedas: "&6✪ &7ᴍᴏᴇᴅᴀs &8• &6{moedas}"
      poder: "&b⚡ &7ᴘᴏᴅᴇʀ &8• &b{poder}"
      kdr: "&c⚔ &7ᴋᴅʀ &8• &c{kdr}"
      clan: "&d⚑ &7ᴄʟᴀɴ &8• &f{clan}"
      tempo-online: "&7Tempo online: &f{tempo}"
      conta-criada: "&7Conta criada em: &f{conta-criada}"
      interacao: "&bClique aqui para interagir com este jogador."

  # HOVERS ADICIONAIS
  # ----------------------------------------------------------
  cargo: "&fCargo: {cargo}"
  invisibilidade: "&fEste jogador está invisível."
  canal: "&7Canal: &f{canal}"
  mensagem: "&7Data de envio: &f{data} &7às &f{hora}"

  # HOVER DA TAG TOP 1
  # {habilidade} -> nome da habilidade em que o jogador é Top 1
  habilidade-top1:
    ativado: true
    formato: "&fTop 1 em &e{habilidade}&f."
    sem-habilidade: "&fTop 1."

  # ----------------------------------------------------------
  # TAGS POR TEMPO JOGADO
  # ----------------------------------------------------------
  # O jogador recebe automaticamente a maior faixa que já alcançou.
  # O tempo é lido da estatística PLAY_ONE_MINUTE do próprio Minecraft.
  tags-tempo-jogado:
    ativado: true
    hover: "&7Tempo jogado: &f{tempo}\n&7Necessário: &f{horas}+ horas"
    faixas:
      - horas: 10
        tag: "&7[Iniciante]"
      - horas: 50
        tag: "&a[Explorador]"
      - horas: 100
        tag: "&b[Experiente]"
      - horas: 250
        tag: "&6[Veterano]"
      - horas: 500
        tag: "&d[Lendário]"

  # ----------------------------------------------------------
  # CHAT LOCAL
  # ----------------------------------------------------------
  local:
    ativado: true
    alcance: 50
    formato: "&e[L]&r {prefix}&f{player}{habilidade_tag}&7: &f{message}"

  # ----------------------------------------------------------
  # CHAT GLOBAL
  # ----------------------------------------------------------
  global:
    ativado: true
    formato: "&7[G]&r {prefix}&f{player}{habilidade_tag}&7: &f{message}"
    formato-sistema: "&7[G]&r &f{message}"

  # ----------------------------------------------------------
  # CHAT DA STAFF
  # ----------------------------------------------------------
  staff:
    ativado: true
    formato: "&c[S]&r {prefix}&f{player}{habilidade_tag}&7: &f{message}"
