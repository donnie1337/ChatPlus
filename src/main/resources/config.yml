# =========================================================
#  ChatPlus - config.yml
# =========================================================
#
# Placeholders disponiveis nos formatos:
#   {prefix}  -> prefixo/cargo fornecido pelo CargoPlus
#   {player}  -> nome do remetente
#   {message} -> mensagem enviada
#   {world}   -> mundo do remetente (local)
#
# A paleta de cores do /cor pertence ao CargoPlus e e exposta
# pelo CargoPlusAPI. O ChatPlus apenas apresenta e aplica a selecao.
#
# As mensagens de entrada e saida NAO possuem cor configuravel.
# A cor e obtida automaticamente do cargo do jogador pelo CargoPlus.
# As mensagens de entrada sao escolhidas aleatoriamente da lista.
# =========================================================

chat:
  delay-segundos: 2
  limite-mensagem: 256

  local:
    ativado: true
    alcance: 50
    formato: "&7[L] {prefix}&f{player}&7: &f{message}"

  global:
    ativado: true
    formato: "&6[G] {prefix}&f{player}&7: &f{message}"

  staff:
    ativado: true
    formato: "&c[S] {prefix}&f{player}&7: &f{message}"

entrada:
  ativado: true
  mensagens:
    - "entrou no servidor!"
    - "acabou de chegar no servidor!"
    - "está online!"
    - "voltou para o servidor!"
    - "chegou para jogar!"
    - "entrou na aventura!"
    - "está de volta!"

saida:
  ativado: false
