# =========================================================
#  ChatPlus - config.yml
# =========================================================
#
# Placeholders disponiveis nos formatos:
#   {prefix}  -> prefixo/cargo fornecido pelo CargoPlus
#   {player}  -> nome do remetente
#   {message} -> mensagem enviada
#   {world}   -> mundo do remetente (local)
#
# A paleta de cores do /cor pertence ao CargoPlus e e exposta
# pelo CargoPlusAPI. O ChatPlus apenas apresenta e aplica a selecao.
# =========================================================

chat:
  delay-segundos: 2
  limite-mensagem: 256

  local:
    ativado: true
    alcance: 50
    formato: "&7[L] {prefix}&f{player}&7: &f{message}"

  global:
    ativado: true
    formato: "&6[G] {prefix}&f{player}&7: &f{message}"

  staff:
    ativado: true
    formato: "&c[S] {prefix}&f{player}&7: &f{message}"
