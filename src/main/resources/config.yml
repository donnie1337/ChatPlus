# ============================================================
# ChatPlus - Configuração principal
# ============================================================
# Placeholders disponíveis:
# {prefix}  -> cargo/prefixo fornecido pelo CargoPlus
# {tag}     -> reservado para compatibilidade; renderizado pelo ChatService
# {player}  -> nome do remetente
# {message} -> mensagem enviada
# {world}   -> mundo do remetente no chat local
#
# A tag do clan é renderizada uma única vez pelo ChatService,
# logo depois do cargo, preservando letras e cores do ClanPlus.
#
# As mensagens de entrada e saída são gerenciadas pelo UtilidadesPlus.
# As chaves técnicas existentes são preservadas para compatibilidade.
# ============================================================

chat:
  # 0 desativa o intervalo entre mensagens.
  delay-segundos: 0
  # Quantidade máxima de caracteres por mensagem.
  limite-mensagem: 256

  # ----------------------------------------------------------
  # CHAT LOCAL
  # ----------------------------------------------------------
  local:
    ativado: true
    alcance: 50
    formato: "&e[L]&r {prefix}&f{player}&7: &f{message}"

  # ----------------------------------------------------------
  # CHAT GLOBAL
  # ----------------------------------------------------------
  global:
    ativado: true
    formato: "&7[G]&r {prefix}&f{player}&7: &f{message}"

  # ----------------------------------------------------------
  # CHAT DA STAFF
  # ----------------------------------------------------------
  staff:
    ativado: true
    formato: "&c[S]&r {prefix}&f{player}&7: &f{message}"
