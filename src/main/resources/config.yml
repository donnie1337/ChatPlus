# =========================================================
#  ChatPlus - config.yml
# =========================================================
#
# Placeholders disponíveis nos formatos:
#   {prefix}  -> cargo/prefixo fornecido pelo CargoPlus
#   {tag}     -> reservado para compatibilidade; a tag é renderizada pelo ChatService
#   {player}  -> nome do remetente
#   {message} -> mensagem enviada
#   {world}   -> mundo do remetente (local)
#
# A tag do clan é renderizada uma única vez pelo ChatService, logo depois do cargo.
# Ela mantém exatamente as letras e cores configuradas no ClanPlus.
#
# As mensagens de entrada e saída são gerenciadas pelo UtilidadesPlus,
# incluindo a lista de mensagens variadas e as preferências do /configurar.
# =========================================================

chat:
  delay-segundos: 0
  limite-mensagem: 256

  local:
    ativado: true
    alcance: 50
    formato: "&e[L] {prefix}&f{player}&7: &f{message}"

  global:
    ativado: true
    formato: "&7[G] {prefix}&f{player}&7: &f{message}"

  staff:
    ativado: true
    formato: "&c[S] {prefix}&f{player}&7: &f{message}"
