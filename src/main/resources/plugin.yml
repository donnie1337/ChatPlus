name: ChatPlus
version: '${project.version}'
main: com.exemplo.chatplus.ChatPlus
api-version: '26.2'
description: Sistema de chat local, global, staff e cores do texto.
author: donnie1337
softdepend:
  - LoginPlus
  - CargoPlus
  - UtilidadesPlus

commands:
  l:
    description: Envia uma mensagem pelo chat local.
    usage: /l <mensagem>
    permission: chat.local
  g:
    description: Envia uma mensagem pelo chat global.
    usage: /g <mensagem>
    permission: chat.global
  s:
    description: Envia uma mensagem pelo chat da staff.
    usage: /s <mensagem>
    permission: chat.staff
  cor:
    description: Abre o menu para escolher a cor do texto do chat.
    usage: /cor
  chat:
    description: Gerencia o ChatPlus.
    usage: /chat reload
    permission: chat.admin

permissions:
  chat.local:
    description: Permite enviar mensagens no chat local.
    default: false
  chat.global:
    description: Permite enviar mensagens no chat global.
    default: false
  chat.staff:
    description: Permite enviar e receber mensagens no chat da staff.
    default: false
  chat.admin:
    description: Permite administrar o ChatPlus. Reservada ao Dono via CargoPlus.
    default: false
